<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProfZOR — демоверсия</title>
  <script>
    (function () {
      if (/^file:/i.test(location.protocol)) {
        location.replace("index.html?demo=1");
        return;
      }
      var path = location.pathname.replace(/demo\.html?$/i, "").replace(/\/demo\/?$/i, "/");
      if (!/\/$/.test(path)) path += "/";
      location.replace(path + "?demo=1");
    })();
  </script>
</head>
<body>
  <p>Открываю демоверсию… <a href="index.html?demo=1">перейти</a></p>
</body>
</html>
